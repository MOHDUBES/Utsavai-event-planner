[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
    "ANN", # annotations
]
ignore = [
    "ANN101", # self type annotation
    "ANN102", # cls type annotation
    "S101",   # use of assert (needed in tests)
    "S105",   # hardcoded password (false positives in config)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-report=html -v"

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__init__.py"]
