<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">UtsavAI Icon</title>
  <desc id="icon-desc">A stylized golden diya flame cradled by a planning checkmark with an AI sparkle</desc>
  <defs>
    <linearGradient id="utsavFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="30%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="utsavCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <radialGradient id="utsavCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Diya base & Checklist checkmark sweep -->
  <path d="M 12 36 C 15 44 22 50 30 50 C 37 50 44 44 54 22" 
        fill="none" 
        stroke="url(#utsavCheckGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Diya lamp rim warm accent -->
  <path d="M 13 36 C 18 41 27 42 33 40" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Outer Diya Flame -->
  <path class="brand-flame-animated" 
        d="M 30 10 C 36 18 42 26 40 34 C 38 41 34 43 30 43 C 26 43 22 41 20 34 C 18 26 24 18 30 10 Z" 
        fill="url(#utsavFlameGrad)" />

  <!-- Inner Flame Core (Luminous Cream Glow) -->
  <path d="M 30 18 C 33 23 35 27 34 33 C 33 37 31 39 30 39 C 29 39 27 37 26 33 C 25 27 27 23 30 18 Z" 
        fill="url(#utsavCoreGlow)" />

  <!-- AI Sparkle (Upper Right) -->
  <path d="M 50 6 Q 50 12 56 12 Q 50 12 50 18 Q 50 12 44 12 Q 50 12 50 6 Z" 
        fill="#F59E0B" />
        
  <!-- Secondary Sparkle (Left Accent) -->
  <path d="M 16 18 Q 16 21 19 21 Q 16 21 16 24 Q 16 21 13 21 Q 16 21 16 18 Z" 
        fill="#FBBF24" opacity="0.9" />
</svg>
