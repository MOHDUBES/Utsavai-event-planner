<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="fav-title">
  <title id="fav-title">UtsavAI Favicon</title>
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Diagonal 4-Point Star (Indigo) -->
  <g transform="rotate(45 16 16)">
    <path d="M 16 4 Q 16 16 28 16 Q 16 16 16 28 Q 16 16 4 16 Q 16 16 16 4 Z"
          fill="url(#favIndigo)" />
  </g>

  <!-- Primary 4-Point Star (Gold) -->
  <path d="M 16 2 Q 16 16 30 16 Q 16 16 16 30 Q 16 16 2 16 Q 16 16 16 2 Z"
        fill="url(#favGold)" />

  <!-- Central Core (White Diamond) -->
  <polygon points="16,10 22,16 16,22 10,16" fill="#FFFFFF" />
  <circle cx="16" cy="16" r="2" fill="#F59E0B" />
</svg>
