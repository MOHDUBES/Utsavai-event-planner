<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-labelledby="logo-light-title logo-light-desc">
  <title id="logo-light-title">UtsavAI Logo</title>
  <desc id="logo-light-desc">UtsavAI festive celebration star brand logo with tagline: Plan every celebration, smartly.</desc>
  <defs>
    <linearGradient id="logoGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoIndigoLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="logoCoreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
  </defs>

  <!-- ── Festive Star Emblem ── -->
  <g transform="translate(6, 6)">
    <!-- Diagonal Star (Indigo) -->
    <g transform="rotate(45 22 22)">
      <path d="M 22 6 Q 22 22 38 22 Q 22 22 22 38 Q 22 22 6 22 Q 22 22 22 6 Z"
            fill="url(#logoIndigoLight)" />
    </g>

    <!-- Primary Star (Gold) -->
    <path d="M 22 2 Q 22 22 42 22 Q 22 22 22 42 Q 22 22 2 22 Q 22 22 22 2 Z"
          fill="url(#logoGoldLight)" />

    <!-- Facet Highlight -->
    <path d="M 22 2 Q 22 22 42 22 L 22 22 Z" fill="#FFFFFF" opacity="0.25" />

    <!-- Center Diamond Core -->
    <polygon points="22,13 31,22 22,31 13,22" fill="url(#logoCoreLight)" />
    <circle cx="22" cy="22" r="2.5" fill="#F59E0B" />
    <circle cx="22" cy="22" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- ── Wordmark & Tagline ── -->
  <text x="58" y="32" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#7C2D12">Utsav<tspan fill="#3730A3" font-weight="900">AI</tspan></text>

  <!-- Sparkle Accent above I -->
  <polygon points="171,11 173,15 177,15 174,18 175,22 171,19 167,22 168,18 165,15 169,15" fill="#F59E0B" />

  <text x="59" y="47" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="0.2" 
        fill="#9A3412">Plan every celebration, smartly.</text>
</svg>
