<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">UtsavAI Icon</title>
  <desc id="icon-desc">UtsavAI festive celebration star and AI intelligence emblem</desc>
  <defs>
    <linearGradient id="utsavGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="utsavIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="utsavCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#utsavGold)" opacity="0.12" />

  <!-- Diagonal 4-Point Star (Indigo AI Radiance) -->
  <g transform="rotate(45 32 32)">
    <path d="M 32 10 Q 32 32 54 32 Q 32 32 32 54 Q 32 32 10 32 Q 32 32 32 10 Z"
          fill="url(#utsavIndigo)" />
  </g>

  <!-- Primary 4-Point Star (Gold/Saffron Festive Radiance) -->
  <path d="M 32 5 Q 32 32 59 32 Q 32 32 32 59 Q 32 32 5 32 Q 32 32 32 5 Z"
        fill="url(#utsavGold)" />

  <!-- Facet Highlights -->
  <path d="M 32 5 Q 32 32 59 32 L 32 32 Z" fill="#FFFFFF" opacity="0.22" />
  <path d="M 32 59 Q 32 32 5 32 L 32 32 Z" fill="#000000" opacity="0.14" />

  <!-- Central Diamond Core (Luminous Jewel) -->
  <polygon points="32,20 44,32 32,44 20,32" fill="url(#utsavCore)" />

  <!-- Core Center Point -->
  <circle cx="32" cy="32" r="3.2" fill="#F59E0B" />
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />

  <!-- 4 Micro Celebration Sparks -->
  <circle cx="32" cy="2.5" r="1.5" fill="#FDE047" />
  <circle cx="61.5" cy="32" r="1.5" fill="#FDE047" />
  <circle cx="32" cy="61.5" r="1.5" fill="#FDE047" />
  <circle cx="2.5" cy="32" r="1.5" fill="#FDE047" />
</svg>
